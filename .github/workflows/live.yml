name: Live shakedown

# Plans real rides against the real routing and search servers. Manual, and weekly so a change on their side is seen.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'

permissions:
  contents: write

jobs:
  shakedown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tests/live/shakedown.mjs live-out
      # The answers are kept on their own branch so they can be read and turned into test fixtures.
      - name: Publish results to the live-results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd live-out
          git init -q -b live-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live shakedown ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-results
